<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Descubre Puerto López</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <div images="logo.jpg">
            <h1>Descubre Puerto López</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    </header>


    <!-- CONTENIDO -->
    <main>

        <section class="introduccion">

            <h2>Contacto y reservas</h2>

            <p>
                Completa el siguiente formulario para solicitar
                información sobre nuestros destinos y servicios.
            </p>

        </section>


        <!-- FORMULARIO -->
        <section class="formulario-seccion">

            <form class="formulario">

                <div class="campo">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Tu número de teléfono"
                    >

                </div>


                <div class="campo">

                    <label for="destino">
                        Destino de interés
                    </label>

                    <select id="destino" name="destino" required>

                        <option value="">
                            Selecciona un destino
                        </option>

                        <option value="puerto-lopez">
                            Playa de Puerto López
                        </option>

                        <option value="isla-plata">
                            Isla de la Plata
                        </option>

                        <option value="los-frailes">
                            Playa Los Frailes
                        </option>

                        <option value="machalilla">
                            Parque Nacional Machalilla
                        </option>

                        <option value="agua-blanca">
                            Comuna Agua Blanca
                        </option>

                        <option value="salango">
                            Salango
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="fecha">
                        Fecha del viaje
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                    >

                </div>


                <div class="campo">

                    <label for="personas">
                        Número de personas
                    </label>

                    <input
                        type="number"
                        id="personas"
                        name="personas"
                        min="1"
                        max="20"
                        placeholder="Ejemplo: 4"
                    >

                </div>


                <div class="campo">

                    <label for="servicio">
                        Servicio de interés
                    </label>

                    <select id="servicio" name="servicio">

                        <option value="">
                            Selecciona un servicio
                        </option>

                        <option value="ballenas">
                            Avistamiento de ballenas
                        </option>

                        <option value="isla">
                            Excursión a Isla de la Plata
                        </option>

                        <option value="machalilla">
                            Tour Parque Nacional Machalilla
                        </option>

                        <option value="gastronomia">
                            Ruta gastronómica
                        </option>

                        <option value="hospedaje">
                            Hospedaje
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="mensaje">
                        Mensaje
                    </label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="6"
                        placeholder="Escribe aquí tu consulta..."
                    ></textarea>

                </div>


                <button type="submit" class="boton">
                    Enviar solicitud
                </button>

            </form>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>
            © 2026 Descubre Puerto López | Turismo en Manabí
        </p>

        <p>
            Proyecto académico - HTML5 y CSS3
        </p>

    </footer>

</body>

</html>
